# GPU server 172.18.131.152; robot client 172.18.133.214.
# Checkpoint saves chunk_size=30 and n_action_steps=30; no override needed.
# Camera wrist is index 0 and top is index 2 on the robot client.
deployment: omx-act
model:
  repo_or_path: maximellerbach/omx_multicubes_act
  device: cuda
execution:
  supported_modes: [chunk]
  rtc:
    enabled: false
  action_fps: 30.0
  action_deadline_s: 5.0
  idle_timeout_s: 30.0
  warmup_calls: 2
language:
  enabled: false
zenoh:
  mode: peer
  listen_endpoints: [tcp/172.18.131.152:7447]
semantics: omx-normalized-joints-gripper-percent-v1
robot_type: omx_follower
features:
  - name: observation.state
    shape: [6]
    dtype: float32
    names: [shoulder_pan.pos, shoulder_lift.pos, elbow_flex.pos, wrist_flex.pos, wrist_roll.pos, gripper.pos]
    semantics: omx-normalized-joints-gripper-percent-v1
  - name: observation.images.wrist
    shape: [480, 640, 3]
    dtype: uint8
    kind: rgb
    semantics: rgb-wrist-v1
  - name: observation.images.top
    shape: [480, 640, 3]
    dtype: uint8
    kind: rgb
    semantics: rgb-top-v1
action_feature:
  name: action
  shape: [6]
  dtype: float32
  names: [shoulder_pan.pos, shoulder_lift.pos, elbow_flex.pos, wrist_flex.pos, wrist_roll.pos, gripper.pos]
  semantics: omx-normalized-joints-gripper-percent-v1
