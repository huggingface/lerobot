# Unitree G1 + SONIC profile for nepyope/sonic_walk.
# Run the server on the GPU host and the rollout client on the G1 Jetson; see
# docs/source/unitree_g1.mdx. Keep the schema in sync with the checkpoint.
deployment: g1-sonic
model:
  repo_or_path: nepyope/sonic_walk
  revision: null
  device: cuda
execution:
  supported_modes: [chunk]
  action_fps: 30.0
  action_deadline_s: 5.0
  idle_timeout_s: 10.0
  warmup_calls: 2
language:
  enabled: false
  deadline_s: 60.0
zenoh:
  mode: peer
  listen_endpoints: [tcp/0.0.0.0:7447]
semantics: unitree-g1-sonic-motion-token-v1
robot_type: unitree_g1
features:
  - name: observation.state
    shape: [64]
    dtype: float32
    names:
