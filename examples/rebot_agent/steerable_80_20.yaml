# Both branches train actions. "high_level" here describes instruction abstraction,
# not a text-prediction target. Branch selection uses the existing recipe sampler.
blend:
  subtask:
    weight: 0.8
    messages:
      - {role: user, content: "${subtask}", stream: low_level, if_present: subtask}
  high_level_task:
    weight: 0.2
    messages:
      # The source task incorrectly specifies blocks and a green bin. Use the
      # demonstrated behavior without imposing an unsupported object set/color.
      - {role: user, content: "Pick up objects from the table and place them into the bin.", stream: low_level}
