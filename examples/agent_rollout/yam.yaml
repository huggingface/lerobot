      max_speed: 0.5
      unit: fraction
      description: 'right calibrated gripper: 0 closed, 1 open'
      tracking_tolerance: 0.15
robot:
  type: bi_yam_follower
  id: bimanual_yam
  read_only: false
  left_arm:
    port: can0
  right_arm:
    port: can1
