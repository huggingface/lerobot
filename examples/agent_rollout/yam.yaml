# Template: verify bounds, units, directions, camera paths and calibration before use.
# Joint mode needs no URDF. Optional Cartesian mode uses LeRobot RobotKinematics:
# supply a verified YAM URDF/tool link per arm (not the standalone I2RT MuJoCo XML).
# Provider fields below are one explicit example, not backend defaults.
interactive: true
fps: 10
interpolation_multiplier: 1
duration: 0
task: Put all colored cubes in the green bin.
inference:
  type: agent
  model: gpt-6.1-sol
  base_url: https://api.openai.com/v1
  api_key_env: OPENAI_API_KEY
  wire: responses
  effort: low
  max_llm_calls: 100
  log_dir: outputs/agent-rollout
  robot_notes: Replace these notes with verified joint directions, camera placement,
    table height and frame/calibration information for your rig. RGB camera images
    do not establish a metric camera-to-base transform.
  axes:
    left_joint_0.pos:
      minimum: -2.61799
      maximum: 3.14159
      max_speed: 0.3
      unit: rad
      description: left YAM joint 0, calibrated robot/model coordinates
      tracking_tolerance: 0.15
    left_joint_1.pos:
      minimum: 0
      maximum: 3.66519
      max_speed: 0.3
      unit: rad
      description: left YAM joint 1, calibrated robot/model coordinates
      tracking_tolerance: 0.15
    left_joint_2.pos:
      minimum: 0
      maximum: 3.14159
      max_speed: 0.3
      unit: rad
      description: left YAM joint 2, calibrated robot/model coordinates
      tracking_tolerance: 0.15
    left_joint_3.pos:
      minimum: -1.69297
      maximum: 1.5708
      max_speed: 0.3
      unit: rad
      description: left YAM joint 3, calibrated robot/model coordinates
      tracking_tolerance: 0.15
    left_joint_4.pos:
      minimum: -1.5708
      maximum: 1.5708
      max_speed: 0.3
      unit: rad
      description: left YAM joint 4, calibrated robot/model coordinates
      tracking_tolerance: 0.15
    left_joint_5.pos:
      minimum: -2.0944
      maximum: 2.0944
      max_speed: 0.3
      unit: rad
      description: left YAM joint 5, calibrated robot/model coordinates
      tracking_tolerance: 0.15
    left_gripper.pos:
      minimum: 0
