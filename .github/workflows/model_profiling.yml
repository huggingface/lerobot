name: Model Profiling

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
    inputs:
      policies:
        description: Comma-separated policies (empty profiles every registered policy)
        type: string
        default: ""
      mode:
        description: Operations to profile
        type: choice
        options: [both, inference, training]
        default: both
      trace:
        description: Collect a separate Torch trace after measuring latency
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: model-profiling-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      policies: ${{ steps.matrix.outputs.policies }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: matrix
        env:
          POLICIES: ${{ inputs.policies }}
        run: echo "policies=$(python scripts/ci/model_profiling.py matrix)" >> "$GITHUB_OUTPUT"

  profile:
    needs: matrix
    runs-on:
      group: aws-g6-4xlarge-plus
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.matrix.outputs.policies) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Profile inference and training in an isolated environment
        env:
          POLICY: ${{ matrix.policy }}
          EXTRA: ${{ matrix.extra }}
          MODE: ${{ inputs.mode || 'both' }}
          TRACE: ${{ inputs.trace || 'false' }}
          HF_TOKEN: ${{ secrets.LEROBOT_HF_USER }}
          PROFILE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python scripts/ci/model_profiling.py init --policy "$POLICY"
          docker run --rm --gpus all --shm-size=16g \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e HF_HOME=/tmp/huggingface \
            -e UV_PROJECT_ENVIRONMENT=/tmp/venv -e UV_CACHE_DIR=/tmp/uv \
            -e HF_TOKEN -e POLICY -e EXTRA -e MODE -e TRACE -e PROFILE_RUN_URL \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            huggingface/lerobot-gpu:latest bash -euo pipefail -c '
              extras=(--extra training)
              if [[ -n "$EXTRA" ]]; then extras+=(--extra "$EXTRA"); fi
              uv sync --locked "${extras[@]}"
              uv run --no-sync python scripts/ci/model_profiling.py run \
                --policy "$POLICY" --profile_mode="$MODE" --trace="$TRACE"
            '
      - name: Upload results even when profiling fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-profiling-${{ matrix.policy }}
          path: profiling-results/
          if-no-files-found: warn

  publish:
    if: always() && needs.matrix.result == 'success'
    needs: [matrix, profile]
    runs-on: ubuntu-latest
    env:
      CI_SLACK_CHANNEL: ${{ secrets.CI_SLACK_CHANNEL }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: model-profiling-*
          path: profiling-results
          merge-multiple: true
      - name: Publish job summary
        id: report
        env:
          POLICIES: ${{ inputs.policies }}
        run: |
          python scripts/ci/model_profiling.py summary >> "$GITHUB_STEP_SUMMARY"
          echo "passed=$(jq '[.[] | select(.status == "success")] | length' profiling-results/results.json)" >> "$GITHUB_OUTPUT"
          echo "total=$(jq 'length' profiling-results/results.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: model-profiling-report
          path: profiling-results/
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        if: vars.MODEL_PROFILING_REPO != ''
      - name: Save run to the Hugging Face dataset
        if: vars.MODEL_PROFILING_REPO != ''
        env:
          HF_TOKEN: ${{ secrets.LEROBOT_HF_USER }}
          RESULTS_REPO: ${{ vars.MODEL_PROFILING_REPO }}
        run: |
          uv run --no-project --with huggingface-hub python - <<'PY'
          import os
          from huggingface_hub import HfApi
          HfApi().upload_folder(
              repo_id=os.environ["RESULTS_REPO"], repo_type="dataset",
              folder_path="profiling-results",
              path_in_repo=f"runs/{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}",
          )
          PY
      - name: Notify the existing CI Slack channel
        if: always() && env.CI_SLACK_CHANNEL != ''
        uses: huggingface/hf-workflows/.github/actions/post-slack@a88e7fa2eaee28de5a4d6142381b1fb792349b67 # main
        with:
          slack_channel: ${{ env.CI_SLACK_CHANNEL }}
          slack_token: ${{ secrets.SLACK_CIFEEDBACK_BOT_TOKEN }}
          title: "LeRobot profiling: ${{ steps.report.outputs.passed || '0' }}/${{ steps.report.outputs.total || '?' }} policies passed"
          status: ${{ needs.profile.result == 'success' && job.status == 'success' && 'success' || 'failure' }}
