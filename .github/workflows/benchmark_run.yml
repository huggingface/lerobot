name: Simulator benchmark
on:
  workflow_call:
    secrets:
      LEROBOT_HF_USER:
        required: true
      DOCKERHUB_LEROBOT_USERNAME:
        required: false
      DOCKERHUB_LEROBOT_PASSWORD:
        required: false
    inputs:
      name:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      sim_tag:
        required: true
        type: string
      build_args:
        required: true
        type: string
      policy_extras:
        required: true
        type: string
permissions: {}
jobs:
  run:
    permissions:
      contents: read
    runs-on:
      group: aws-g6-4xlarge-plus
    env:
      HF_TOKEN: ${{ secrets.LEROBOT_HF_USER }}
      BENCHMARK_NAME: ${{ inputs.name }}
      SIM_IMAGE: lerobot-sim-${{ inputs.name }}:${{ inputs.sim_tag }}
      POLICY_IMAGE: lerobot-policy:${{ github.sha }}-${{ inputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: true
      - name: Require benchmark credentials
        run: test -n "$HF_TOKEN"
      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKERHUB_LEROBOT_USERNAME }}
          password: ${{ secrets.DOCKERHUB_LEROBOT_PASSWORD }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_LEROBOT_USERNAME }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cache-binary: false
      - name: Format build arguments
        id: arguments
        env:
          BUILD_ARGUMENTS: ${{ inputs.build_args }}
        run: |
          python3 - <<'PY'
          import json, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('args<<ARGS\n')
              for key, value in json.loads(os.environ['BUILD_ARGUMENTS']).items():
                  f.write(f'{key}={value}\n')
              f.write('ARGS\n')
          PY
      - name: Build simulator
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          tags: ${{ env.SIM_IMAGE }}
          build-args: ${{ steps.arguments.outputs.args }}
          load: true
          push: false
      - name: Build policy from tested checkout
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile.policy
          tags: ${{ env.POLICY_IMAGE }}
          build-args: POLICY_EXTRAS=${{ inputs.policy_extras }}
          load: true
          push: false
      - name: Run evaluation and training smoke
        run: |
          python3 -m pip install 'PyYAML>=6,<7'
          python3 scripts/ci/run_sim_benchmark.py --name "$BENCHMARK_NAME" \
            --sim-image "$SIM_IMAGE" --policy-image "$POLICY_IMAGE" --artifacts "$RUNNER_TEMP/sim-$BENCHMARK_NAME"
      - name: Upload metrics, videos, training artifacts and server logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.name }}-benchmark
          path: ${{ runner.temp }}/sim-${{ inputs.name }}/
          if-no-files-found: warn
