name: RoboCasa PR 4860 matched comparison
run-name: PR 4860 camera mapping and instruction controls
on:
  workflow_dispatch:
permissions: {}
concurrency:
  group: codex-robocasa-4860-ab
  cancel-in-progress: false
jobs:
  compare:
    permissions:
      contents: read
    runs-on:
      group: aws-g6-4xlarge-plus
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        camera_map: [old, fixed]
        prompt: [default, task_name]
    name: RoboCasa ${{ matrix.camera_map }} map / ${{ matrix.prompt }} prompt
    env:
      HF_TOKEN: ${{ secrets.LEROBOT_HF_USER }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
        with:
          cache-binary: false
      - name: Verify source matches PR and record file hashes
        run: |
          git diff --exit-code d3bbc288b93e2b8eaa61f63cc52c4f8498c70407 -- src
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          info = {
              "code_head": git("rev-parse", "HEAD"),
              "source_tree": git("rev-parse", "HEAD:src"),
              "source_changes": git("diff", "d3bbc288b93e2b8eaa61f63cc52c4f8498c70407", "--", "src"),
              "source_files": {str(p): hashlib.sha256(p.read_bytes()).hexdigest()
                               for p in Path("src").rglob("*.py")},
          }
          Path("scripts/ci/robocasa_4860_source.json").write_text(json.dumps(info, indent=2))
          PY
      - uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ secrets.DOCKERHUB_LEROBOT_USERNAME }}
          password: ${{ secrets.DOCKERHUB_LEROBOT_PASSWORD }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_LEROBOT_USERNAME }}
      - name: Build pinned RoboCasa image with unchanged PR source
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: docker/Dockerfile.benchmark.robocasa
          push: false
          load: true
          tags: lerobot-robocasa-4860:compare
      - name: Run three tasks and three seeds, one fresh process per episode
        env:
          CAMERA_MAP: ${{ matrix.camera_map }}
          PROMPT_MODE: ${{ matrix.prompt }}
        run: |
          docker run --name robocasa-4860 --gpus all --shm-size=4g \
            -e HF_TOKEN -e MUJOCO_GL=egl -e HF_HOME=/tmp/hf \
            -e HF_HUB_DOWNLOAD_TIMEOUT=300 \
            lerobot-robocasa-4860:compare \
            python scripts/ci/robocasa_4860_compare.py \
              "$CAMERA_MAP" "$PROMPT_MODE" /tmp/robocasa-4860-results
      - name: Collect complete results and failure logs
        if: always()
        run: |
          mkdir -p /tmp/robocasa-4860-results
          docker cp robocasa-4860:/tmp/robocasa-4860-results/. /tmp/robocasa-4860-results/ || true
          docker rm -f robocasa-4860 || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: robocasa-4860-${{ matrix.camera_map }}-${{ matrix.prompt }}
          path: /tmp/robocasa-4860-results/
          if-no-files-found: error
