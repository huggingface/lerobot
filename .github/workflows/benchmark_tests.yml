name: Benchmark Integration Tests
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"
  push:
    branches: [main]
    paths: &benchmark_paths
      - "src/lerobot/envs/**"
      - "src/lerobot/sims/**"
      - "src/lerobot/env_server/**"
      - "src/lerobot/transport/**"
      - "src/lerobot/policies/**"
      - "src/lerobot/processor/**"
      - "src/lerobot/scripts/lerobot_eval.py"
      - "src/lerobot/scripts/lerobot_train.py"
      - "src/lerobot/scripts/lerobot_env_server.py"
      - "src/lerobot/robots/remote/**"
      - "src/lerobot/rollout/**"
      - "src/lerobot/inference/**"
      - "benchmarks/**"
      - "scripts/ci/**"
      - "docker/**"
      - ".github/workflows/benchmark*.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches: [main]
    paths: *benchmark_paths
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  matrix:
    permissions:
      contents: read
    if: >-
      github.repository == 'huggingface/lerobot' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
    runs-on: ubuntu-latest
    outputs:
      benchmarks: ${{ steps.matrix.outputs.benchmarks }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 -m pip install 'PyYAML>=6,<7'
      - id: matrix
        run: echo "benchmarks=$(python3 scripts/ci/benchmark_matrix.py)" >> "$GITHUB_OUTPUT"
  benchmark:
    needs: matrix
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.benchmarks) }}
    uses: ./.github/workflows/benchmark_run.yml
    with:
      name: ${{ matrix.name }}
      dockerfile: ${{ matrix.dockerfile }}
      sim_tag: ${{ matrix.sim_tag }}
      build_args: ${{ toJSON(matrix.build_args) }}
      policy_extras: ${{ join(matrix.policy_extras, ' ') }}
    secrets:
      LEROBOT_HF_USER: ${{ secrets.LEROBOT_HF_USER }}
