[build-system]
requires = ["setuptools>=69.0,<81.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_openarm_gripette"
version = "0.1.0"
description = "Grabette policy runners for LeRobot's built-in OpenArm Gripette follower."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "lerobot[openarms] @ git+https://github.com/huggingface/lerobot.git@feat/openarms-motorbridge",
    "gripette @ git+https://github.com/pollen-robotics/grabette.git@a209c431ef8f9aa1be09e9fc1bfaf16e3baafca9#subdirectory=packages/gripette",
    "openarm-gripette-model @ git+https://github.com/pollen-robotics/grabette-policy.git@c0e997b15b7b50a485577fa6d059875cfc62e849#subdirectory=robots/openarm/openarm_gripette_model",
    # gripette's generated gRPC code requires this runtime, but its own metadata only asks for >=4.25.
    "protobuf>=6.33.5,<8.0.0",
]

[project.optional-dependencies]
# Grabette policy runners: rollout/data visualization and placo IK on the OpenArm + Gripette URDF.
policy = [
    "lerobot[dataset,kinematics,viz] @ git+https://github.com/huggingface/lerobot.git@feat/openarms-motorbridge",
]

[tool.setuptools.packages.find]
include = ["lerobot_robot_openarm_gripette*"]

[tool.ruff]
extend = "../pyproject.toml"

[tool.ruff.lint.extend-per-file-ignores]
"**" = ["D"]
