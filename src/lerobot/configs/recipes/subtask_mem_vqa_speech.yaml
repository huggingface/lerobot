# Adds spoken interjection responses and camera-grounded VQA to combined memory/subtask training.
# Missing optional annotations skip only their sub-recipe; `say` tool calls tokenize as `<say>...</say>`.
# Input memory/subtask are active at t-1 second; assistant targets are active at t.
# Runtime must parse and retain the generated memory.

blend:

  high_level_memory_subtask:
    weight: 0.35
    bindings:
      prior_memory: "active_at(t, style=memory, role=assistant, seconds_ago=1.0)"
      current_subtask: "active_at(t, style=subtask, role=assistant, seconds_ago=1.0)"
      memory: "active_at(t, style=memory, role=assistant)"
      subtask: "active_at(t, style=subtask, role=assistant)"
    messages:
      - role: user
        stream: high_level
        content: |-
          Goal: ${task}
          Memory: ${prior_memory}
          Current subtask: ${current_subtask}
          Update memory from observed progress. Repeat the current subtask unless observations support completion or show that it needs to change. Reply with Memory: followed by Subtask:.
      - role: assistant
        stream: high_level
        target: true
        if_present: memory
        content: |-
          Memory: ${memory}
          Subtask: ${subtask}

  low_level_execution:
    weight: 0.40
    bindings:
      subtask: "active_at(t, style=subtask, role=assistant)"
    messages:
      # The low-level stream trains action flow on the generated or annotated subtask.
      - {role: user, content: "${subtask}", stream: low_level, if_present: subtask}


  user_interjection_response:
    weight: 0.10
    bindings:
      interjection: "emitted_at(t, style=interjection)"
      speech: "emitted_at(t, role=assistant, tool_name=say)"
    messages:
      - {role: user, content: "${task}", stream: high_level}
      - {role: user, content: "${interjection}", stream: high_level, if_present: interjection}
      # The assistant target is a `say` tool call flattened to a `<say>...</say>` marker.
      - {role: assistant, stream: high_level, target: true, if_present: speech, tool_calls_from: speech}

  # Each camera uses a separate VQA sub-recipe for view-specific binding.
  ask_vqa_top:
    weight: 0.075
    route: vqa
    bindings:
      vqa_query: "emitted_at(t, style=vqa, role=user, camera=observation.images.front)"
      vqa: "emitted_at(t, style=vqa, role=assistant, camera=observation.images.front)"
    messages:
      - role: user
        stream: high_level
        if_present: vqa_query
        content:
          - {type: image, feature: observation.images.front}
          - {type: text, text: "${vqa_query}"}
      - {role: assistant, content: "${vqa}", stream: high_level, target: true, if_present: vqa}

  ask_vqa_wrist:
    weight: 0.075
    route: vqa
    bindings:
      vqa_query: "emitted_at(t, style=vqa, role=user, camera=observation.images.wrist)"
      vqa: "emitted_at(t, style=vqa, role=assistant, camera=observation.images.wrist)"
    messages:
      - role: user
        stream: high_level
        if_present: vqa_query
        content:
          - {type: image, feature: observation.images.wrist}
          - {type: text, text: "${vqa_query}"}
      - {role: assistant, content: "${vqa}", stream: high_level, target: true, if_present: vqa}
