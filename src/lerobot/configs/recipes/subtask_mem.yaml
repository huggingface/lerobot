# Trains one memory-and-subtask response, plus subtask-conditioned action flow.
# Uses assistant timelines at t-1 second as input and at t as the target.
# Missing memory skips the high-level target; absent prior memory means an empty scratchpad.
# Runtime must split the response, retain Memory, and execute only Subtask.

blend:

  high_level_memory_subtask:
    # Preserve the combined weight of the former subtask and memory-update branches.
    weight: 0.40
    bindings:
      prior_memory: "active_at(t, style=memory, role=assistant, seconds_ago=1.0)"
      current_subtask: "active_at(t, style=subtask, role=assistant, seconds_ago=1.0)"
      memory: "active_at(t, style=memory, role=assistant)"
      subtask: "active_at(t, style=subtask, role=assistant)"
    messages:
      - role: user
        stream: high_level
        content: |-
          Goal: ${task}
          Memory: ${prior_memory}
          Current subtask: ${current_subtask}
          Update memory from observed progress. Repeat the current subtask unless observations support completion or show that it needs to change. Reply with Memory: followed by Subtask:.
      - role: assistant
        stream: high_level
        target: true
        if_present: memory
        content: |-
          Memory: ${memory}
          Subtask: ${subtask}

  low_level_execution:
    weight: 0.60
    bindings:
      subtask: "active_at(t, style=subtask, role=assistant)"
    messages:
      # The low-level stream trains action flow on the generated or annotated subtask.
      - {role: user, content: "${subtask}", stream: low_level, if_present: subtask}
