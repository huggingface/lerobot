# Trains one memory-and-subtask response, plus subtask-conditioned action flow.
# Requires a continuous subtask timeline and causal memory annotations.
# Missing memory skips the high-level target; absent prior memory means an empty scratchpad.
# Runtime must split the response, retain Memory, and execute only Subtask.

blend:

  high_level_memory_subtask:
    # Preserve the combined weight of the former subtask and memory-update branches.
    weight: 0.40
    bindings:
      prior_memory: "nth_prev(style=memory, offset=1)"
    messages:
      - {role: user, content: "${task}", stream: high_level}
      - {role: assistant, content: "Previous memory: ${prior_memory}", stream: high_level, if_present: prior_memory}
      - role: user
        stream: high_level
        content: "Update the memory from observed progress and choose the next subtask. Reply with Memory: followed by Subtask:."
      - role: assistant
        stream: high_level
        target: true
        if_present: memory
        content: |-
          Memory: ${memory}
          Subtask: ${subtask}

  low_level_execution:
    weight: 0.60
    messages:
      # The low-level stream trains action flow on the generated or annotated subtask.
      - {role: user, content: "${subtask}", stream: low_level, if_present: subtask}
