# The leader arms and gamepad, served to the cart. Runs AT THE OPERATOR
# STATION (rosie, the Pi):
#
#   ./config/operator-leader-host.sh
#
# Fields are at the TOP LEVEL - this is an XLerobotLeaderGamepadConfig, not a
# teleoperate config, so there is no `teleop:` key to nest under.
#
# Nothing about the robot appears here. This process only reads the leaders
# and the pad and publishes actions; the cart decides what to do with them.

id: xlerobot_leaders

# The by-id paths travel with the USB adapter, so they are the same strings
# whichever machine the leaders are plugged into.
left_arm_config:
  port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5B90149222-if00
right_arm_config:
  port: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5A7A017922-if00

# --- which robot is on the other end ----------------------------------
#
# false  -> keys stay as BiSOLeader emits them (left_shoulder_pan.pos),
#           which is what bi_so_follower wants: its send_action does
#           key.removeprefix("left_").   Use with cart-remote-arms.yaml.
# true   -> keys become left_arm_shoulder_pan.pos, which is what xlerobot
#           wants: it filters with startswith("left_arm_").
#           Use with cart-remote.yaml.
#
# Getting this wrong is SILENT. The link comes up, the loop runs at the
# right rate, and the arms never move.
remap_arm_prefix: false

# --- which parts of the robot this speaks for -------------------------
#
# TODAY: arms only. The head servos (IDs 7-8 on bus1) and the base wheels
# are not built yet, and sending a bi_so_follower keys it has no motors for
# is not harmless - it would also put columns in a recorded dataset that the
# robot cannot reproduce.
#
# Flip both to true once the head and base exist, and switch the cart to
# config/cart-remote.yaml at the same time. The two must agree.
emit_head: false
emit_base: false

# Differential drive cannot strafe, so no y.vel when the base does arrive.
emit_y_vel: false

# --- gamepad ----------------------------------------------------------
#
# MEASURED 2026-10-09 on the 8BitDo SF30 Pro with the guided probe, not
# guessed. Four of the nine previous values were wrong.
#
# The pad was in a PLAYSTATION-COMPATIBLE MODE - it enumerates as
# "Sony Computer Entertainment Wireless Controller", vendor 054c product
# 05c4, 6 axes / 13 buttons. That is why these are DS4-style numbers rather
# than the XInput layout that was here before.
#
# IF THE PAD EVER POWER-CYCLES INTO A DIFFERENT MODE, EVERY NUMBER BELOW
# BECOMES WRONG AT ONCE, and the symptom is not an error - it is a cart
# that drives sideways when you push forward. Re-probe rather than guess:
#
#   uv run --project ../XLeRobot python -m \
#     lerobot_teleoperator_xlerobot_leader_gamepad.probe_gamepad
#
joystick_index: 0
deadzone: 0.15

axis_base_forward: 1      # left stick Y
axis_base_strafe: 0       # left stick X
axis_base_turn: 3         # right stick X
axis_head_pan: 3          #   shared with turn; hold the modifier to aim the head
axis_head_tilt: 4         # right stick Y

# Measured from the sign when pushing UP, not assumed: both sticks report
# negative upward, so both need inverting for up to mean forward/raise.
invert_base_forward: true
invert_head_tilt: true

button_head_modifier: 4   # L1
button_speed_up: 5        # R1
button_speed_down: 6      # L2 - a button on this pad, not an axis
