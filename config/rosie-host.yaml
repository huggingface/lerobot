# Robot config for the ZMQ host on rosie. Passed as:
#   python -m lerobot_robot_xlerobot.xlerobot_host --config_path=config/rosie-host.yaml
#
# Fields are at the TOP LEVEL here - this is an XLerobotConfig, not a
# teleoperate config, so there is no `robot:` key to nest under.
#
# The camera names and sizes here must match config/elroy-client.yaml exactly:
# the host encodes frames under these keys and the client decodes by the same
# keys and shapes. A mismatch shows up as missing or garbled images, not as an
# error.

id: rosie

port1: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5A7A058116-if00   # left arm + head
port2: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5A68009991-if00   # right arm + base

disable_torque_on_disconnect: true

cameras:
  left_wrist:
    type: opencv
    index_or_path: /dev/cam_left
    width: 1280
    height: 720
    fps: 30
    fourcc: MJPG       # YUYV caps 1280x720 at 10fps on these Innomakers
    warmup_s: 1

  right_wrist:
    type: opencv
    index_or_path: /dev/cam_right
    width: 1280
    height: 720
    fps: 30
    fourcc: MJPG
    warmup_s: 1

  head:
    type: intelrealsense
    serial_number_or_name: "836112060112"
    width: 1280
    height: 720
    fps: 30
    color_mode: BGR
    # Depth is not streamed over ZMQ - the host JPEG-encodes colour frames
    # only - so enabling it costs USB bandwidth for nothing here.
    use_depth: false
