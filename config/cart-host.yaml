# Robot config for the ZMQ host ON THE CART.
#
#   python -m lerobot_robot_xlerobot.xlerobot_host --config_path=config/cart-host.yaml
#
# WHICH MACHINE: elroy, the Jetson Orin Nano, riding on the cart with the
# follower arms, the wrist cameras and the head RealSense wired to it.
# The Pi is the operator station now - see config/operator-client.yaml.
#
# Named by ROLE, not by hostname: the cart computer changed once already and
# will again. Everything here is about the side of the link, not the box.
#
# Fields are at the TOP LEVEL - this is an XLerobotConfig, not a teleoperate
# config, so there is no `robot:` key to nest under.
#
# The camera names and sizes must match config/operator-client.yaml exactly:
# the host encodes frames under these keys and the client decodes by the same
# keys and shapes. A mismatch shows up as missing or garbled images, not as
# an error.
#
# RESOLUTION IS SET FOR WIFI. The cart is wireless, so every frame served
# here crosses the air. Three 720p30 JPEG streams is ~100 Mbps sustained and
# the link will not hold it; 640x480 is roughly a third of that.
#
# This limit applies to TELEOPERATION ONLY. Recording does not go through
# this file - config/cart-record.sh opens the cameras directly on the cart,
# so datasets can be captured at full resolution regardless of what the
# operator sees. See that script.

id: xlerobot          # the robot's calibration id, not a hostname. If you
                      # already calibrated xlerobot as "rosie", either rename
                      # ~/.cache/huggingface/lerobot/calibration/robots/xlerobot/rosie.json
                      # or set ROBOT_ID=rosie when launching.

port1: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5A7A058116-if00   # left arm + head
port2: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5A68009991-if00   # right arm + base

disable_torque_on_disconnect: true

cameras:
  left_wrist:
    type: opencv
    index_or_path: /dev/cam_left
    width: 640
    height: 480
    fps: 30
    fourcc: MJPG       # YUYV caps 1280x720 at 10fps on these Innomakers
    warmup_s: 1

  right_wrist:
    type: opencv
    index_or_path: /dev/cam_right
    width: 640
    height: 480
    fps: 30
    fourcc: MJPG
    warmup_s: 1

  head:
    type: intelrealsense
    serial_number_or_name: "836112060112"
    width: 640
    height: 480
    fps: 30
    color_mode: BGR
    # Depth is not streamed over ZMQ - the host JPEG-encodes colour frames
    # only - so enabling it costs USB bandwidth for nothing here.
    use_depth: false
