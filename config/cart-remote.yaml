# The cart, driven by leaders at the operator station. FULL ROBOT - arms,
# head and base. Runs ON THE CART (elroy, the Orin):
#
#   ./config/cart-teleop.sh
#   ./config/cart-record.sh <repo_id> "<task>"
#
# BASE: one field, `base:`, picks the configuration; the type stays
# xlerobot_2wheels_odrive for all three.
#   odrive       two brushless wheels on an ODESC/ODrive over USB (default);
#                bus 2 is the right arm only, ids 1-6; no y.vel
#   omniwheels   the stock three servo wheels, ids 7-9 on bus 2; has y.vel
#   none         arms and head only; no .vel features at all
# BASE=<which> on cart-teleop.sh / cart-record.sh / cart-selftest.sh
# overrides it for one run. The operator's emit_y_vel should be true only
# with omniwheels; with the others a y.vel is ignored with one warning.
#
# Everything the robot has is LOCAL to this machine; only the leaders are
# remote. Camera frames go straight from USB to the dataset at full rate -
# they never touch the network - while the one thing that does cross the air
# is small and tolerates loss. This machine both records and will later run
# the policy, so the dataset is captured through exactly the pipeline
# inference will see.
#
# The operator end must agree with this file:
#   remap_arm_prefix: true    xlerobot filters on "left_arm_"
#   emit_head: true
#   emit_base: true
# See config/operator-leader-host.yaml.

# Match the cameras. lerobot's teleoperate defaults to fps: 60, which three
# 30 fps cameras can never satisfy - observe() alone cannot beat ~33 ms - so
# the loop spends its life being told off for missing a target that was
# never reachable. Measured: observe is 94.6% of all work at 31.7 ms mean,
# while the remote leader costs 0.05 ms.
fps: 30

robot:
  type: xlerobot_2wheels_odrive
  base: odrive            # odrive | omniwheels | none - or BASE=<which> on the scripts
  id: xlerobot

  port1: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5A7A058116-if00   # left arm + head
  port2: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5A68009991-if00   # right arm only

  # --- the ODrive base -------------------------------------------------
  # Geometry: MEASURE THESE. x.vel in m/s and theta.vel in deg/s - in the
  # dataset and on the operator's screen - are only as true as these two
  # numbers. wheel_radius is half the tyre's outside diameter under load;
  # wheelbase is centre-to-centre between the two tyres' contact patches.
  wheel_radius: 0.0825      # 165 mm wheel
  wheelbase: 0.25
  # If forward drives the robot in a circle, one of these is wrong.
  invert_left_wheel: true
  invert_right_wheel: false
  # Per-wheel clamp, m/s. Keep it low until the directions are proven.
  max_linear_mps: 0.5

  disable_torque_on_disconnect: true

  cameras:
    left_wrist:
      type: opencv
      index_or_path: /dev/cam_left
      width: 640
      height: 480
      fps: 30
      fourcc: MJPG           # YUYV caps 1280x720 at 10fps on these Innomakers
      buffer_size: 2         # video.sh probe: 4 = 133 ms stale under load, 1 = 15 fps, 2 = 30 fps and <= 1 frame
      warmup_s: 1

    right_wrist:
      type: opencv
      index_or_path: /dev/cam_right
      width: 640
      height: 480
      fps: 30
      fourcc: MJPG
      buffer_size: 2         # video.sh probe: 4 = 133 ms stale under load, 1 = 15 fps, 2 = 30 fps and <= 1 frame
      warmup_s: 1

    head:
      type: intelrealsense
      serial_number_or_name: "836112060112"
      width: 640
      height: 480
      fps: 30
      # color_mode: RGB (the default), like the wrists. It was BGR, which put the
      # head camera in the dataset with red and blue swapped relative to the
      # wrists; the zero-copy fix in camera_realsense.py made RGB safe.
      use_depth: false

# The leaders are at the operator station. This end only opens a socket.
teleop:
  type: xlerobot_leader_remote
  id: xlerobot_leaders
  remote_ip: 192.168.1.100     # rosie. Use rosie.local if DHCP moves it.
  port_zmq_actions: 5557

  # NOTE: the operator end must set remap_arm_prefix: TRUE for this robot.
  # xlerobot filters incoming actions with startswith("left_arm_").
  # Mismatch is silent - the loop runs and the arms do not move.

  # connect() waits this long for the first action, and will not invent one:
  # the first action carries the leaders' current pose and the followers
  # move to it.
  connect_timeout_s: 10.0

  # Past this with no new action the link counts as stalled. The arms hold
  # their last commanded position; the base is zeroed, because a base keeps
  # driving on its last velocity and the operator who would have stopped it
  # is on the far side of the break.
  stale_after_ms: 300
  stop_base_when_stale: true

display_data: false            # the scripts turn this on; see them for how
