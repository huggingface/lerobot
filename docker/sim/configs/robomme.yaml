# Settings left out (fps, control mode, component names, robot type) come from the integration's conventions().
deployment: robomme
sim:
  type: robomme
  task: PickXtimes,BinFill,StopCube,MoveCube,InsertPeg,SwingXtimes,VideoUnmask,ButtonUnmask,PickHighlight,PatternLock
  kwargs:
    episode_length: 300
    action_space: joint_angle
    dataset_split: test
    task_ids:
    - 0
    front_camera_name: camera1
    wrist_camera_name: camera2
