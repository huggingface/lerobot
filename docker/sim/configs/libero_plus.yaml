# Settings left out (fps, control mode, component names, robot type) come from the integration's conventions().
deployment: libero_plus
sim:
  type: libero_plus
  task: libero_spatial
  kwargs:
    task_ids:
    - 0
    - 100
    - 260
    - 500
    - 1000
    - 1500
    - 2000
    - 2400
    episode_length: null
    obs_type: pixels_agent_pos
    render_mode: rgb_array
    camera_name: agentview_image,robot0_eye_in_hand_image
    init_states: true
    hard_reset: true
    camera_name_mapping: null
    observation_height: 360
    observation_width: 360
    is_libero_plus: true
    control_mode: relative
    fps: 20
