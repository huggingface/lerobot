# Conventions (fps, control, semantics, component names) come from lerobot/sims/conventions.py.
deployment: vlabench
sim:
  type: vlabench
  task: select_fruit,select_toy,select_book,select_painting,select_drink,select_ingredient,select_billiards,select_poker,add_condiment,insert_flower
  kwargs:
    gym_kwargs:
      obs_type: pixels_agent_pos
      render_mode: rgb_array
      render_resolution:
      - 480
      - 480
      robot: franka
      max_episode_steps: 50
      action_mode: eef
